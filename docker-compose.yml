services:

  # 1. PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: billing_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_user -d billing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: gateway_redis
    ports:
      - "6379:6379"

  # 3. Kafka
  kafka:
      image: apache/kafka:4.0.0
      container_name: billing_kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # 4. Account Service
  account-service:
    build:
      context: ../account-service/account-service
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/account_db
      SPRING_DATASOURCE_USERNAME: billing_user
      SPRING_DATASOURCE_PASSWORD: billing_password
    depends_on:
      postgres-db:
        condition: service_healthy

  # 5. Billing Service
  billing-service:
    build:
      context: .
    container_name: billing-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/billing_db
      SPRING_DATASOURCE_USERNAME: billing_user
      SPRING_DATASOURCE_PASSWORD: billing_password

      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: Nyamal'sminioadminpassword
      MINIO_BUCKET: invoices

    depends_on:
      postgres-db:
        condition: service_healthy

  # 6. API Gateway
  api-gateway:
    build:
      context: ../api-gateway/api-gateway
    container_name: api-gateway
    ports:
      - "8083:8083"
    depends_on:
      - redis
      - account-service
      - billing-service

    # 7. Keycloak
  keycloak:
      image: quay.io/keycloak/keycloak:26.7.3
      container_name: billing_keycloak
      command: start-dev
      ports:
        - "8180:8080"
      environment:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin_password
      volumes:
        - keycloak_data:/opt/keycloak/data

    # 8. MinIO
  minio:
       image:  quay.io/minio/minio:latest
       container_name: billing_minio
       ports:
         - "9000:9000"
         - "9001:9001"
       environment:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: Nyamal'sminioadminpassword
       command: server /data --console-address ":9001"
       volumes:
          - minio_data:/data

volumes:
  pgdata:
  keycloak_data:
  minio_data:






