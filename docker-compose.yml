services:
  postgres-db:
    image: postgres:16-alpine
    container_name: billing_postgres
    ports:
     -  "5432:5432"
    environment:
      POSTGRES_DB: billing-db
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:






