<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Billing System Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #fafafa; color: #333; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 15px; background: #fff; }
        input, select { padding: 6px; margin-right: 10px; width: 140px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 6px 12px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #0056b3; }
        pre { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .row { margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>Subscription Billing Dashboard</h2>

<!-- 1. CUSTOMERS -->
<div class="card">
    <h3>Customer Management</h3>
    <div class="row">
        <div class="col">
       <!--First Name: Required -->
        <label for="firstName">First Name*:</label>
        <input type="text" id="firstName" placeholder="First Name" required
               oninput="if(this.value) this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">

        <!-- Middle Name: Optional -->
        <label for="middleName">Middle Name:</label>
        <input type="text" id="middleName" placeholder="Middle Name (Optional)"
               oninput="if(this.value) this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">

        <!-- Last Name: Required -->
        <label for="lastName">Last Name*:</label>
        <input type="text" id="lastName" placeholder="Last Name" required
               oninput="if(this.value) this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">
        </div><br>
        <div class="col">
        <label for="customerEmail">Customer Email</label>
        <input type="email" id="customerEmail" placeholder="Email"
               oninput="if(this.value) this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">
        <button onclick="createCustomer()">Create</button>
        </div>

    </div>

    <div class="row">

        <button onclick="apiCall('/customers')">Get All Customers</button><br><br>

        <label for="customerId">Customer ID:</label>
        <input type="number" id="customerId" placeholder="Customer ID">

        <button onclick="apiCall('/customers/' + document.getElementById('customerId').value)">Get By ID</button>

    </div>
</div>

<!-- 2. PLANS -->
<div class="card">
    <h3>Plan Configuration</h3>
    <div class="row">
        <label for="planName">Plan Name:</label>
        <input type="text" id="planName" placeholder="Plan Name"
               oninput="if(this.value) this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">

        <label for="billingCycle">Billing Cycle:</label>
        <select id="billingCycle">
            <option value="WEEKLY">WEEKLY</option>
            <option value="MONTHLY" selected>MONTHLY</option>
            <option value="YEARLY">YEARLY</option>
        </select>

        <label for="planPrice">Plan Price:</label>
        <input type="number" id="planPrice" placeholder="Price (Cents)">

        <button onclick="createPlan()">Create</button>

    </div>
    <div class="row">

        <button onclick="apiCall('/plans')">Get All Plans</button>

        <label for="searchPlanId">Search Plan ID:</label>
        <input type="number" id="searchPlanId" placeholder="Plan ID">
        <button onclick="apiCall('/plans/' + document.getElementById('searchPlanId').value)">Get By ID</button>


    </div>
</div>

<!-- 3. SUBSCRIPTIONS -->
<div class="card">
    <h3>Subscription Management</h3>
    <div class="row">
        <label for="subCustomerId">Sub Customer ID:</label>
        <input type="number" id="subCustomerId" placeholder="Customer ID">

        <label for="subPlanId">Sub Plan ID:</label>
        <input type="number" id="subPlanId" placeholder="Plan ID">

        <button onclick="createSubscription()">Submit</button>
    </div>
    <div class="row">
        <button onclick="apiCall('/subscriptions')">Get All Subscriptions</button>

        <label for="searchSubId">Search Sub ID</label>
        <input type="number" id="searchSubId" placeholder="Sub ID">
        <button onclick="apiCall('/subscriptions/' + document.getElementById('searchSubId').value)">Get By ID</button>
    </div>
</div>

<!-- 4. INVOICES -->
<div class="card">
    <h3>Invoices Ledger</h3>
    <div class="row">
        <button onclick="apiCall('/invoices')">Get All Invoices</button>

        <label for="searchInvoiceId">Search Invoice ID:</label>
        <input type="number" id="searchInvoiceId" placeholder="Invoice ID">

        <button onclick="apiCall('/invoices/' + document.getElementById('searchInvoiceId').value)">Get By ID</button>
    </div>
    <div class="row">

        <label for ="invoiceCustomerId">Invoice Customer ID:</label>
        <input type="number" id="invoiceCustomerId" placeholder="Customer ID">
        <button onclick="apiCall('/customers/' + document.getElementById('invoiceCustomerId').value + '/invoices')">Filter By Customer</button>
    </div>
</div>

<!-- 5. PAYMENTS -->
<div class="card">
    <h3>Core Payment Processor</h3>
    <div class="row">
        <label for="payInvoiceId">Pay Invoice ID:</label>
        <input type="number" id="payInvoiceId" placeholder="Invoice ID">
        <label for="payStatus">Payment Status:</label>
        <select id="payStatus">
            <option value="SUCCESS">SUCCESS</option>
            <option value="FAILED">FAILED</option>
        </select>
        <button onclick="processPayment()">Execute Payment</button>
    </div>
    <div class="row">
        <button onclick="apiCall('/payment-attempts')">Get System History</button>
        <label for="historyCustomerId">History Customer ID</label>
        <input type="number" id="historyCustomerId" placeholder="Customer ID">
        <button onclick="apiCall('/customers/' + document.getElementById('historyCustomerId').value + '/payment-attempts')">Filter By Customer</button>
    </div>
</div>

<!-- 6. LOG CONSOLE -->
<div class="card">
    <h3>Server Response Stream</h3>
    <pre id="output">Server responses will display here...</pre>
</div>

<script>
    const API_BASE = 'http://localhost:8080/api';
    const out = document.getElementById('output');

    // Super function: Handles all simple GET requests automatically to save code space
    async function apiCall(path) {
        try {
            const r = await fetch(API_BASE + path);
            const d = await r.json();
            out.textContent = JSON.stringify(d, null, 2);
        } catch (e) { out.textContent = "Error: " + e.message; }
    }

    // Handle Custom POST Requests
    async function postCall(path, bodyObj) {
        try {
            const r = await fetch(API_BASE + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyObj)
            });
            const d = await r.json();
            out.textContent = JSON.stringify(d, null, 2);
        } catch (e) { out.textContent = "Error: " + e.message; }
    }

    function createCustomer() {
        postCall('/customers', {
            firstName: document.getElementById('firstName').value,
            middleName: document.getElementById('middleName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('customerEmail').value
        });
    }

    function createPlan() {

        postCall('/plans', {
            name: document.getElementById('planName').value,
            priceCents: parseInt(document.getElementById('planPrice').value),
            billingCycle: document.getElementById('billingCycle').value,
            billing_Cycle: document.getElementById('billingCycle').value
        });
    }

    function createSubscription() {
        postCall('/subscriptions', {
            customerId: parseInt(document.getElementById('subCustomerId').value),
            planId: parseInt(document.getElementById('subPlanId').value),

        });
    }

    function processPayment() {
        postCall('/payments/process', {
            invoiceId: parseInt(document.getElementById('payInvoiceId').value),
            status: document.getElementById('payStatus').value
        });
    }
</script>
</body>
</html>
