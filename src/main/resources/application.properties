spring.application.name=billing-service

#Database connection settings
spring.datasource.url=jdbc:postgresql://postgres-db:5432/billing_db
spring.datasource.username=billing_user
spring.datasource.password=billing_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

#flyway settings(Enables database migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=kafka:9092

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/billing-realm/protocol/openid-connect/certs

minio.url=http://minio:9000
minio.access-key=minioadmin
minio.secret-key=Nyamal'sminioadminpassword
minio.bucket=invoices
minio.public-url=http://host.docker.internal:9000
